[project]
name = "quantum-optical-bus-simulation"
version = "0.1.0"
description = "Hybrid quantum-classical calibration dashboard for squeezed-light TDM optical buses"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.11,<1.14",
  "matplotlib>=3.8,<4",
  "strawberryfields>=0.5,<1",
  "streamlit>=1.34,<2",
]

[project.optional-dependencies]
# Meep often requires conda or Linux packages.
full = ["meep"]
demo = ["pillow"]
yaml = ["pyyaml"]
dev = ["ruff", "pre-commit"]
test = ["pytest", "ruff", "pyyaml"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.format]
line-ending = "lf"

[project.scripts]
qobus-build = "quantum_optical_bus.cli:main_build"
qobus-verify = "quantum_optical_bus.cli:main_verify"
qobus = "quantum_optical_bus.cli:main"
